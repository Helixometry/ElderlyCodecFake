# BONSAI Configuration for Elderly Codec Deepfake Detection

model:
  languagebind_dim: 768
  imagebind_dim: 1024
  hidden_dim: 512
  dropout: 0.3

training:
  batch_size: 16
  epochs: 50
  learning_rate: 1e-4
  weight_decay: 1e-2
  gradient_clip: 1.0

scheduler:
  type: ReduceLROnPlateau
  factor: 0.5
  patience: 5

data:
  sample_rate: 16000
  max_length: 30
  languages:
    - en
    - zh

device: cuda
seed: 42
num_workers: 4

logging:
  tensorboard: true
  log_interval: 10
